title: PowerShell Download Cradle
id: b8676130-bb3d-5a00-a259-b2ecec2af38a
status: experimental
description: PowerShell command line contains common web-request or download patterns.
references:
- https://attack.mitre.org/techniques/T1059/001/
- Dataset-specific field mapping must be verified before production use.
author: Cyberion Defense Labs project
date: 2026/10/28
tags:
- attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    CommandLine|contains:
    - DownloadString
    - Invoke-WebRequest
  condition: selection
falsepositives:
- Legitimate automation and software deployment may download content; tune against
  approved scripts and destinations.
level: high
x_cdl_rule_id: CDL-WIN-002
